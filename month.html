<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Schedule — Dr.Heinrich information</title>
<style>
  :root{
    --base:#050508;
    --panel:#0D0D17;
    --text:#F2F0FA;
    --muted:#9A94B8;
    --accent:#B49CFF;
    --line:rgba(180,156,255,.16);
  }
  *{box-sizing:border-box}
  html{background:var(--base);scrollbar-width:thin;scrollbar-color:#B49CFF #0D0D17}
  ::-webkit-scrollbar{width:8px;height:8px}
  ::-webkit-scrollbar-track{background:#0D0D17}
  ::-webkit-scrollbar-thumb{background:rgba(180,156,255,.55);border-radius:4px}
  ::-webkit-scrollbar-thumb:hover{background:#B49CFF}
  body{
    margin:0;
    background:var(--panel);
    color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Noto Sans JP",sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  .wrap{max-width:720px;margin:0 auto;padding:28px 22px 32px}
  .label{
    font-size:11px;letter-spacing:.32em;text-transform:uppercase;
    color:var(--accent);font-weight:600;margin:0 0 10px;
  }
  .title-jp{font-size:22px;font-weight:600;letter-spacing:.04em;margin:0 0 6px}
  .sub{font-size:12px;color:var(--muted);letter-spacing:.08em;margin:0 0 24px}

  /* One block per day that has events. */
  .day{padding:20px 0 8px;border-top:1px solid var(--line)}
  .day:first-child{border-top:none;padding-top:2px}
  .day-head{display:flex;align-items:baseline;gap:12px;margin:0 0 6px}
  .daynum{
    font-size:30px;font-weight:600;line-height:1;
    font-variant-numeric:tabular-nums;letter-spacing:.02em;
  }
  .day.today .daynum{color:var(--accent)}
  .daydate{font-size:15px;font-weight:600;letter-spacing:.04em}
  .daydate .wd{color:var(--muted);font-weight:500}
  .daydate .wd.sat{color:var(--accent)}
  .today-pill{
    font-size:10px;font-weight:600;letter-spacing:.24em;text-transform:uppercase;
    color:var(--panel);background:var(--accent);
    padding:3px 8px 3px 10px;border-radius:999px;align-self:center;
  }

  ul.events{list-style:none;margin:0;padding:0}
  li.event{
    display:flex;gap:16px;align-items:baseline;
    padding:11px 0;
  }
  .time{
    flex:0 0 auto;min-width:108px;
    color:var(--accent);font-size:14px;font-weight:600;
    font-variant-numeric:tabular-nums;letter-spacing:.03em;white-space:nowrap;
  }
  .time.allday{min-width:108px;font-size:12px;letter-spacing:.18em}
  .main{min-width:0}
  .title{font-size:15px;line-height:1.55;word-break:break-word}
  .title a{color:inherit;text-decoration:none}
  .title a:hover,.title a:focus{color:var(--accent);text-decoration:underline}
  .location{font-size:12px;color:var(--muted);line-height:1.5;margin-top:3px;word-break:break-word}
  .empty{font-size:14px;color:var(--muted);padding:22px 0;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
  .error{font-size:13px;color:var(--muted);padding:22px 0}
  @media (max-width:420px){
    .wrap{padding:22px 16px 26px}
    .title-jp{font-size:20px}
    .daynum{font-size:26px}
    li.event{flex-direction:column;gap:4px}
    .time{min-width:0}
  }
</style>
</head>
<body>
  <main class="wrap">
    <p class="label">SCHEDULE</p>
    <h1 class="title-jp">今後の予定</h1>
    <p class="sub">UPCOMING SCHEDULE</p>
    <div id="content"><p class="empty">読み込み中…</p></div>
  </main>
<script>
(function(){
  "use strict";
  var TZ = "Asia/Tokyo";
  var WEEKDAYS_JP = ["日","月","火","水","木","金","土"];
  var RANGE_DAYS = 31; // today through today+31 days, inclusive

  // Format a Date as YYYY-MM-DD in Asia/Tokyo, regardless of viewer timezone.
  function tokyoDateKey(d){
    var parts = new Intl.DateTimeFormat("en-CA",{
      timeZone:TZ, year:"numeric", month:"2-digit", day:"2-digit"
    }).formatToParts(d);
    var y,m,dd;
    parts.forEach(function(p){
      if(p.type==="year") y=p.value;
      if(p.type==="month") m=p.value;
      if(p.type==="day") dd=p.value;
    });
    return y + "-" + m + "-" + dd;
  }

  function tokyoParts(d){
    var parts = new Intl.DateTimeFormat("en-CA",{
      timeZone:TZ, year:"numeric", month:"2-digit", day:"2-digit"
    }).formatToParts(d);
    var out={};
    parts.forEach(function(p){ out[p.type]=parseInt(p.value,10); });
    return out;
  }

  // HH:MM (24h) in Asia/Tokyo.
  function tokyoTime(d){
    return new Intl.DateTimeFormat("en-GB",{
      timeZone:TZ, hour:"2-digit", minute:"2-digit", hour12:false
    }).format(d);
  }

  function esc(s){
    return String(s == null ? "" : s)
      .replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;")
      .replace(/"/g,"&quot;").replace(/'/g,"&#39;");
  }

  function pad(n){ return (n < 10 ? "0" : "") + n; }

  // Build a YYYY-MM-DD key from Tokyo year/month/day parts plus a day offset.
  // Calendar arithmetic on UTC parts is timezone-free and safe here.
  function keyFromParts(y, m, d){
    var dt = new Date(Date.UTC(y, m - 1, d));
    return dt.getUTCFullYear() + "-" + pad(dt.getUTCMonth() + 1) + "-" + pad(dt.getUTCDate());
  }

  // Weekday index (0=Sun) for a YYYY-MM-DD key, via timezone-free UTC math.
  function weekdayOfKey(key){
    var p = key.split("-");
    return new Date(Date.UTC(+p[0], +p[1] - 1, +p[2])).getUTCDay();
  }

  function render(events){
    var now = new Date();
    var tp = tokyoParts(now);
    var startKey = tokyoDateKey(now);
    var endKey = keyFromParts(tp.year, tp.month, tp.day + RANGE_DAYS);

    // Group events by their Asia/Tokyo start date, within the range.
    var byDay = {};
    (events || []).forEach(function(ev){
      if(!ev || !ev.start) return;
      var key = tokyoDateKey(new Date(ev.start));
      if(key < startKey || key > endKey) return;
      (byDay[key] = byDay[key] || []).push(ev);
    });
    var keys = Object.keys(byDay).sort();
    keys.forEach(function(k){
      byDay[k].sort(function(a,b){
        // All-day events first, then by start time.
        if(!!a.allDay !== !!b.allDay) return a.allDay ? -1 : 1;
        return new Date(a.start) - new Date(b.start);
      });
    });

    var box = document.getElementById("content");
    if(!keys.length){
      box.innerHTML = '<p class="empty">今後の予定はありません</p>';
      return;
    }

    var html = '';
    keys.forEach(function(key){
      var p = key.split("-");
      var monthNum = parseInt(p[1], 10);
      var dayNum = parseInt(p[2], 10);
      var dow = weekdayOfKey(key);
      var isToday = (key === startKey);
      var wdCls = (dow === 6) ? "wd sat" : "wd";

      html += '<section class="day' + (isToday ? " today" : "") + '">';
      html += '<div class="day-head">' +
        '<div class="daynum">' + dayNum + '</div>' +
        '<div class="daydate">' + monthNum + '月' + dayNum + '日' +
        '<span class="' + wdCls + '">（' + WEEKDAYS_JP[dow] + '）</span></div>' +
        (isToday ? '<span class="today-pill">Today</span>' : '') +
        '</div>';

      html += '<ul class="events">';
      byDay[key].forEach(function(ev){
        var timeHtml;
        if(ev.allDay){
          timeHtml = '<div class="time allday">終日</div>';
        } else {
          var s = tokyoTime(new Date(ev.start));
          timeHtml = '<div class="time">' + esc(s) + '</div>';
        }
        // Titles link to the FANY ticket page when the event has a url.
        var titleHtml = ev.url
          ? '<a href="' + esc(ev.url) + '" target="_blank" rel="noopener">' + esc(ev.title) + '</a>'
          : esc(ev.title);
        html += '<li class="event">' + timeHtml +
          '<div class="main"><div class="title">' + titleHtml + '</div>' +
          (ev.location ? '<div class="location">' + esc(ev.location) + '</div>' : '') +
          '</div></li>';
      });
      html += '</ul></section>';
    });
    box.innerHTML = html;
  }

  function load(){
    fetch("events.json?t=" + Date.now(), {cache:"no-store"})
      .then(function(r){ if(!r.ok) throw new Error("HTTP " + r.status); return r.json(); })
      .then(render)
      .catch(function(){
        document.getElementById("content").innerHTML =
          '<p class="error">予定を読み込めませんでした</p>';
      });
  }

  load();
  // Re-fetch every 30 minutes while the page stays open.
  setInterval(load, 30 * 60 * 1000);
})();
</script>
</body>
</html>
