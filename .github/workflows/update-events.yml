name: Update events.json

on:
  schedule:
    # Every 3 hours (UTC). Data freshness is bounded by this cadence.
    - cron: "0 */3 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install icalendar

      - name: Build events.json from the calendar feed
        env:
          ICS_URL: ${{ secrets.ICS_URL }}
        run: python build_events.py

      - name: Commit and push if changed
        run: |
          git config user.name "widget-bot"
          git config user.email "widget-bot@users.noreply.github.com"
          git add events.json
          if git diff --cached --quiet; then
            echo "events.json unchanged — nothing to commit."
          else
            git commit -m "Update events.json"
            git push
          fi
