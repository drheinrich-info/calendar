<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Latest Posts — Dr.Heinrich information</title>
<style>
  :root{
    --base:#050508;
    --panel:#0D0D17;
    --text:#F2F0FA;
    --muted:#9A94B8;
    --accent:#B49CFF;
    --line:rgba(180,156,255,.16);
  }
  *{box-sizing:border-box}
  html{background:var(--base);scrollbar-width:thin;scrollbar-color:#B49CFF #0D0D17}
  ::-webkit-scrollbar{width:8px;height:8px}
  ::-webkit-scrollbar-track{background:#0D0D17}
  ::-webkit-scrollbar-thumb{background:rgba(180,156,255,.55);border-radius:4px}
  ::-webkit-scrollbar-thumb:hover{background:#B49CFF}
  body{
    margin:0;
    background:var(--panel);
    color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Noto Sans JP",sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  .wrap{max-width:720px;margin:0 auto;padding:28px 22px 32px}
  .label{
    font-size:11px;letter-spacing:.32em;text-transform:uppercase;
    color:var(--accent);font-weight:600;margin:0 0 10px;
  }
  .title-jp{font-size:22px;font-weight:600;letter-spacing:.04em;margin:0 0 6px}
  .sub{font-size:12px;color:var(--muted);letter-spacing:.08em;margin:0 0 24px}
  .sub a{color:inherit;text-decoration:none}
  .sub a:hover,.sub a:focus{color:var(--accent);text-decoration:underline}

  /* One card per post; the whole card is a link to the post on X. */
  .post{
    display:block;padding:16px 0;
    border-top:1px solid var(--line);
    color:inherit;text-decoration:none;
  }
  .post:last-child{border-bottom:1px solid var(--line)}
  .post-date{
    color:var(--accent);font-size:13px;font-weight:600;
    font-variant-numeric:tabular-nums;letter-spacing:.06em;margin:0 0 6px;
  }
  .post-text{font-size:14px;line-height:1.75;white-space:pre-wrap;word-break:break-word}
  .post:hover .post-text,.post:focus .post-text{color:var(--accent)}

  /* Friendly fallback card (no posts yet, or posts.json unavailable). */
  .post-empty{
    display:block;padding:22px 0;
    border-top:1px solid var(--line);border-bottom:1px solid var(--line);
    color:var(--muted);font-size:14px;line-height:1.7;text-decoration:none;
  }
  .post-empty .handle{color:var(--accent);letter-spacing:.04em}
  .post-empty:hover,.post-empty:focus{color:var(--accent)}

  .empty{font-size:14px;color:var(--muted);padding:22px 0;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
  @media (max-width:420px){
    .wrap{padding:22px 16px 26px}
    .title-jp{font-size:20px}
  }
</style>
</head>
<body>
  <main class="wrap">
    <p class="label">LATEST POSTS</p>
    <h1 class="title-jp">最新ポスト</h1>
    <p class="sub"><a href="https://x.com/DrHeinrich_info" target="_blank" rel="noopener">@DrHeinrich_info</a></p>
    <div id="content"><p class="empty">読み込み中…</p></div>
  </main>
<script>
(function(){
  "use strict";
  var TZ = "Asia/Tokyo";
  var WEEKDAYS_JP = ["日","月","火","水","木","金","土"];
  var PROFILE_URL = "https://x.com/DrHeinrich_info";
  var MAX_POSTS = 5;

  function tokyoParts(d){
    var parts = new Intl.DateTimeFormat("en-CA",{
      timeZone:TZ, year:"numeric", month:"2-digit", day:"2-digit"
    }).formatToParts(d);
    var out={};
    parts.forEach(function(p){ out[p.type]=p.value; });
    return out;
  }

  // Weekday index (0=Sun) for a Date in Asia/Tokyo.
  function tokyoWeekday(d){
    var wd = new Intl.DateTimeFormat("en-US",{timeZone:TZ, weekday:"short"}).format(d);
    return ["Sun","Mon","Tue","Wed","Thu","Fri","Sat"].indexOf(wd);
  }

  // HH:MM (24h) in Asia/Tokyo.
  function tokyoTime(d){
    return new Intl.DateTimeFormat("en-GB",{
      timeZone:TZ, hour:"2-digit", minute:"2-digit", hour12:false
    }).format(d);
  }

  // "11月20日（金）12:34" in Asia/Tokyo.
  function formatDate(iso){
    var d = new Date(iso);
    var p = tokyoParts(d);
    return parseInt(p.month,10) + "月" + parseInt(p.day,10) + "日（" +
      WEEKDAYS_JP[tokyoWeekday(d)] + "）" + tokyoTime(d);
  }

  function esc(s){
    return String(s == null ? "" : s)
      .replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;")
      .replace(/"/g,"&quot;").replace(/'/g,"&#39;");
  }

  function renderEmpty(){
    document.getElementById("content").innerHTML =
      '<a class="post-empty" href="' + PROFILE_URL + '" target="_blank" rel="noopener">' +
      '最新のポストはXでチェックしてね<br>' +
      '<span class="handle">@DrHeinrich_info</span></a>';
  }

  function render(data){
    var posts = ((data && data.posts) || []).filter(function(p){
      return p && p.date && p.text && !isNaN(new Date(p.date));
    }).sort(function(a,b){
      return new Date(b.date) - new Date(a.date); // newest first
    }).slice(0, MAX_POSTS);

    if(!posts.length){ renderEmpty(); return; }

    var html = '';
    posts.forEach(function(p){
      var url = p.url || PROFILE_URL;
      html += '<a class="post" href="' + esc(url) + '" target="_blank" rel="noopener">' +
        '<div class="post-date">' + esc(formatDate(p.date)) + '</div>' +
        '<div class="post-text">' + esc(p.text) + '</div></a>';
    });
    document.getElementById("content").innerHTML = html;
  }

  function load(){
    fetch("posts.json", {cache:"no-store"})
      .then(function(r){ if(!r.ok) throw new Error("HTTP " + r.status); return r.json(); })
      .then(render)
      .catch(function(){ renderEmpty(); });
  }

  load();
  // Re-fetch every 30 minutes while the page stays open.
  setInterval(load, 30 * 60 * 1000);
})();
</script>
</body>
</html>
